<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="aero: backend, discord bots, ai tools">
  <title>aero</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8b4fe"/>
      <stop offset="0.55" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.025"/>
    </pattern>
    <style>
      text { font-family: ui-monospace, 'JetBrains Mono', 'Cascadia Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .type { animation: type 3.2s steps(26) 0.6s both; }
      @keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    </style>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="1198" height="328" rx="16" fill="#0b0a12" stroke="#2b2540" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="328" rx="16" fill="url(#scan)"/>
  <path d="M1 44 H1199" stroke="#1d1a2b" stroke-width="2"/>
  <circle cx="30" cy="23" r="6.5" fill="#3b3452"/>
  <circle cx="52" cy="23" r="6.5" fill="#3b3452"/>
  <circle cx="74" cy="23" r="6.5" fill="#a855f7"/>
  <text x="600" y="28" text-anchor="middle" font-size="14" fill="#6f6889">aero@github: ~</text>

  <!-- prompt -->
  <text x="64" y="76" font-size="20"><tspan fill="#c084fc">~/aero</tspan><tspan fill="#8b85a3"> $ </tspan><tspan fill="#e9e6f5">whoami</tspan></text>

  <!-- pixel logo -->
  <g fill="url(#g)" filter="url(#glow)"><rect x="82" y="128" width="15" height="15" rx="2"/><rect x="100" y="128" width="15" height="15" rx="2"/><rect x="118" y="128" width="15" height="15" rx="2"/><rect x="136" y="146" width="15" height="15" rx="2"/><rect x="82" y="164" width="15" height="15" rx="2"/><rect x="100" y="164" width="15" height="15" rx="2"/><rect x="118" y="164" width="15" height="15" rx="2"/><rect x="136" y="164" width="15" height="15" rx="2"/><rect x="64" y="182" width="15" height="15" rx="2"/><rect x="136" y="182" width="15" height="15" rx="2"/><rect x="82" y="200" width="15" height="15" rx="2"/><rect x="100" y="200" width="15" height="15" rx="2"/><rect x="118" y="200" width="15" height="15" rx="2"/><rect x="136" y="200" width="15" height="15" rx="2"/><rect x="190" y="128" width="15" height="15" rx="2"/><rect x="208" y="128" width="15" height="15" rx="2"/><rect x="226" y="128" width="15" height="15" rx="2"/><rect x="172" y="146" width="15" height="15" rx="2"/><rect x="244" y="146" width="15" height="15" rx="2"/><rect x="172" y="164" width="15" height="15" rx="2"/><rect x="190" y="164" width="15" height="15" rx="2"/><rect x="208" y="164" width="15" height="15" rx="2"/><rect x="226" y="164" width="15" height="15" rx="2"/><rect x="244" y="164" width="15" height="15" rx="2"/><rect x="172" y="182" width="15" height="15" rx="2"/><rect x="190" y="200" width="15" height="15" rx="2"/><rect x="208" y="200" width="15" height="15" rx="2"/><rect x="226" y="200" width="15" height="15" rx="2"/><rect x="280" y="128" width="15" height="15" rx="2"/><rect x="316" y="128" width="15" height="15" rx="2"/><rect x="334" y="128" width="15" height="15" rx="2"/><rect x="280" y="146" width="15" height="15" rx="2"/><rect x="298" y="146" width="15" height="15" rx="2"/><rect x="352" y="146" width="15" height="15" rx="2"/><rect x="280" y="164" width="15" height="15" rx="2"/><rect x="280" y="182" width="15" height="15" rx="2"/><rect x="280" y="200" width="15" height="15" rx="2"/><rect x="406" y="128" width="15" height="15" rx="2"/><rect x="424" y="128" width="15" height="15" rx="2"/><rect x="442" y="128" width="15" height="15" rx="2"/><rect x="388" y="146" width="15" height="15" rx="2"/><rect x="460" y="146" width="15" height="15" rx="2"/><rect x="388" y="164" width="15" height="15" rx="2"/><rect x="460" y="164" width="15" height="15" rx="2"/><rect x="388" y="182" width="15" height="15" rx="2"/><rect x="460" y="182" width="15" height="15" rx="2"/><rect x="406" y="200" width="15" height="15" rx="2"/><rect x="424" y="200" width="15" height="15" rx="2"/><rect x="442" y="200" width="15" height="15" rx="2"/></g>

  <!-- tagline -->
  <text x="534" y="166" font-size="26" fill="#e9e6f5">backend <tspan fill="#a855f7">·</tspan> discord bots <tspan fill="#a855f7">·</tspan> ai tools</text>
  <text class="type" x="534" y="204" font-size="19" fill="#8b85a3"><tspan fill="#a855f7">→</tspan> building tag-team + relay</text>

  <!-- bottom prompt -->
  <text x="64" y="296" font-size="20"><tspan fill="#c084fc">~/aero</tspan><tspan fill="#8b85a3"> $ </tspan><tspan class="cursor" fill="#e9e6f5">█</tspan></text>
</svg>
