name: Banner

# Keeps the "→ building …" line in assets/banner.svg pointed at the newest public repo.
on:
  schedule: [{ cron: "17 */3 * * *" }] # every 3 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/scripts/banner.mjs", ".github/workflows/banner.yml"]

permissions:
  contents: write

concurrency:
  group: profile-commits
  cancel-in-progress: false

jobs:
  banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate banner
        run: node .github/scripts/banner.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if it changed
        run: |
          if git diff --quiet -- assets/banner.svg; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/banner.svg
          git commit -m "Update banner: newest repo [skip ci]"
          git pull --rebase
          git push
